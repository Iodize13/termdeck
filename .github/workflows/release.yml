name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - run: pip install cargo-zigbuild   # bundles zig
      - run: cargo test --locked
      - run: cargo zigbuild --locked --release --target aarch64-unknown-linux-musl
      - run: cp target/aarch64-unknown-linux-musl/release/termdeck termdeck-aarch64
      - uses: softprops/action-gh-release@v2
        with:
          files: termdeck-aarch64
          generate_release_notes: true
